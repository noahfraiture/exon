name: Native Helix Nix
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helix-nix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build --no-update-lock-file
      - name: Build and test the native package
        run: nix flake check --print-build-logs --no-update-lock-file
